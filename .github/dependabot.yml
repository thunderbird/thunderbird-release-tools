version: 2
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-deps:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns:
          - "*"
