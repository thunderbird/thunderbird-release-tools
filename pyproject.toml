[project]
name = "tb-release"
version = "0.1.0"
description = "Thunderbird release engineering tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tb-release = "tb_release.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tb_release"]

# Bundle the directories holding the scripts that tb-release runs, at the same
# paths as in the repository (see tb_release/cli.py).
[tool.hatch.build.targets.wheel.force-include]
"releases/scripts" = "tb_release/scripts/releases/scripts"
"balrog" = "tb_release/scripts/balrog"
